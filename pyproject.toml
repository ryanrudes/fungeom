[build-system]
# hatchling is upper-bounded for the same reason ruff is (see [project.optional-dependencies]):
# an unpinned build backend drifts. hatchling 1.28+ emits `Metadata-Version: 2.5`, which the
# SHA-pinned gh-action-pypi-publish in release.yml rejects with "not a valid metadata version",
# so a release built fine and then failed at the publish step. 1.27 emits 2.4 and publishes.
# The alternative fix is bumping that action pin to a build that understands 2.5 — do that
# deliberately, verify it publishes, then raise this bound.
requires = ["hatchling>=1.25,<1.28", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "fungeom"
dynamic = ["version"]                # derived from the latest vX.Y.Z git tag (hatch-vcs)
description = "Functional geometry as an immutable, decidable resolver graph."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Ryan Rudes" }]
keywords = ["geometry", "functional", "transforms", "frames", "decidability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "rich>=15.0.0",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  # Upper-bounded on purpose: ruff 0.16 changed import ordering and formatting, so an
  # unpinned floor let CI install a newer linter than any developer had and fail `main`
  # on 54 pre-existing findings in code nobody had touched. A lint rule is a style
  # decision, and adopting a new one is a deliberate repo-wide change (`ruff check --fix`
  # + `ruff format`, some of it needing `--unsafe-fixes`), not something a release should
  # discover. Raise this bound when that migration is done on purpose.
  "ruff>=0.15,<0.16",
  "mypy>=1.11",
]

[project.urls]
Repository = "https://github.com/ryanrudes/fungeom"
Documentation = "https://github.com/ryanrudes/fungeom/wiki"
Issues = "https://github.com/ryanrudes/fungeom/issues"
Changelog = "https://github.com/ryanrudes/fungeom/blob/main/CHANGELOG.md"

# Version comes from git tags (hatch-vcs). No tag yet -> fall back to the baseline below, so a
# tag-less checkout still builds; once a `vX.Y.Z` tag exists it drives the version exactly.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.hatch.build.targets.wheel]
packages = ["src/fungeom"]

[tool.hatch.build.targets.sdist]
include = ["src/fungeom", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".venv"]

[tool.mypy]
python_version = "3.13"
files = ["src/fungeom", "examples"]
strict = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["scipy.*", "shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["fungeom"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_also = [
    "if TYPE_CHECKING:",
]
