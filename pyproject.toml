[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fungeom"
version = "0.1.0"
description = "Functional geometry as an immutable, decidable resolver graph."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Ryan Rudes" }]
keywords = ["geometry", "functional", "transforms", "frames", "decidability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "rich>=15.0.0",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.urls]
Repository = "https://github.com/ryanrudes/fungeom"
Issues = "https://github.com/ryanrudes/fungeom/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fungeom"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".venv"]

[tool.mypy]
python_version = "3.13"
files = ["src/fungeom", "examples"]
strict = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["scipy.*", "shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["fungeom"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_also = [
    "if TYPE_CHECKING:",
]
